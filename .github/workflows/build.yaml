name: "build"
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@main
      - name: install nix
        uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            sandbox = false
      - uses: cachix/cachix-action@master
        with:
          name: opensource
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: damianfral/nix-cache-lookup@master
        id: cache-lookup-default
        name: Check if already cached
        with:
          flake-attribute: .#default
      - name: nix build
        run: nix build
        if: steps.cache-lookup-default.outputs.cached != 'true'
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@main
      - name: install nix
        uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            sandbox = false
      - uses: cachix/cachix-action@master
        with:
          name: opensource
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: damianfral/nix-cache-lookup@master
        id: cache-lookup-brainhask-bench-results
        name: Check if already cached
        with:
          flake-attribute: .#brainhask-bench-results
      - name: brainhask-bench
        run: |
          nix build .#brainhask-bench-results --accept-flake-config
          cat ./result/benchmark-results.html > ~/benchmark-results.html

        if: steps.cache-lookup-brainhask-bench-results.outputs.cached != 'true'
      - name: upload-bench-results
        uses: actions/upload-artifact@main
        with:
          name: brainhask-bench-results-${{ github.run_id }}-${{ github.run_number }}
          path: ~/benchmark-results.html
        if: steps.cache-lookup-brainhask-bench-results.outputs.cached != 'true'
